apiVersion: apps/v1
kind: Deployment
metadata:
  name: neverland
  namespace: tink-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neverland
  template:
    metadata:
      labels:
        app: neverland
    spec:
      serviceAccountName: neverland
      containers:
        - name: neverland
          image: git.kontango.io/kore/neverland:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8091
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8091"
            - name: TINK_NAMESPACE
              value: "tink-system"
            - name: ARTIFACTS_PATH
              value: "/artifacts"
            - name: NGINX_URL
              value: "http://10.11.30.91:8080"
            - name: SMEE_DEPLOYMENT
              value: "smee"
            - name: BOOT_BASE_URL
              value: "https://boot.kontango.net"
            - name: DOWNLOADS_PATH
              value: "/downloads"
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: neverland-postgres
                  key: dsn
                  optional: true
            - name: BOOT_CONFIG_API_BASE
              value: "https://git.konoss.org/api/v1"
            - name: BOOT_CONFIG_REPO_OWNER
              value: "public"
            - name: BOOT_CONFIG_REPO_NAME
              value: "neverland"
            - name: BOOT_CONFIG_REPO_REF
              value: "main"
            - name: BOOT_CONFIG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: boot-config-git-token
                  key: token
                  optional: true
            - name: BOOT_CONFIG_CACHE_TTL
              value: "30s"
          volumeMounts:
            - name: artifacts
              mountPath: /artifacts
            - name: downloads
              mountPath: /downloads
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8091
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: hook-artifacts
        - name: downloads
          hostPath:
            path: /var/lib/kontango-boot-downloads
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: neverland
  namespace: tink-system
  labels:
    app: neverland
spec:
  type: NodePort
  selector:
    app: neverland
  ports:
    - port: 8091
      targetPort: 8091
      nodePort: 31810
