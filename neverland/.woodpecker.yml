when:
  - event: push
    branch: [main]
  - event: tag

steps:
  - name: test
    image: golang:1.25-alpine
    commands:
      - go test ./...

  - name: build-and-push
    image: docker:cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - REGISTRY="git.kontango.io"
      - IMAGE="$REGISTRY/kore/neverland"
      - SHORT_SHA="${CI_COMMIT_SHA:0:8}"
      - echo "$GIT_TOKEN" | docker login "$REGISTRY" -u kadmin --password-stdin
      - docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .
      - docker push "$IMAGE:latest"
      - docker push "$IMAGE:$SHORT_SHA"
      - |
        if [ -n "$CI_COMMIT_TAG" ]; then
          docker tag "$IMAGE:latest" "$IMAGE:$CI_COMMIT_TAG"
          docker push "$IMAGE:$CI_COMMIT_TAG"
        fi
    secrets: [GIT_TOKEN]
