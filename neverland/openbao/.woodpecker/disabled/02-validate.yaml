when:
  - event: [push, pull_request, manual]

steps:
  - name: check-credentials
    image: alpine:3.20
    commands:
      - echo "=== Checking Forgejo credentials ==="
      - |
        FAIL=0
        if [ -z "$${FORGEJO_USERNAME}" ]; then
          echo "FAIL: FORGEJO_USERNAME secret not set"
          FAIL=1
        else
          echo "PASS: FORGEJO_USERNAME is set"
        fi
      - |
        if [ -z "$${FORGEJO_PASSWORD}" ]; then
          echo "FAIL: FORGEJO_PASSWORD secret not set"
          FAIL=1
        else
          echo "PASS: FORGEJO_PASSWORD is set"
        fi
      - |
        if [ "$${FAIL}" = "1" ]; then
          echo ""
          echo "ERROR: Forgejo credentials missing — no secrets manager configured"
          exit 1
        fi
      - echo "Credentials verified."
    environment:
      FORGEJO_USERNAME:
        from_secret: forgejo_username
      FORGEJO_PASSWORD:
        from_secret: forgejo_password

  - name: fetch-secrets
    image: alpine:3.20
    commands:
      - apk add --no-cache jq curl
      - echo "=== Reading secrets provider from konfig.json ==="
      - |
        if [ ! -f deploy/konfig.json ]; then
          echo "FAIL: deploy/konfig.json not found"
          exit 1
        fi
      - |
        PROVIDER=$(jq -r '.secrets.provider // empty' deploy/konfig.json)
        SECRET_PATH=$(jq -r '.secrets.path // empty' deploy/konfig.json)
        APP_NAME=$(jq -r '.name // empty' deploy/konfig.json)

        if [ -z "$PROVIDER" ]; then
          echo "FAIL: secrets.provider not set in konfig.json"
          exit 1
        fi
        if [ -z "$SECRET_PATH" ]; then
          echo "FAIL: secrets.path not set in konfig.json"
          exit 1
        fi

        echo "Provider: $PROVIDER"
        echo "Path: $SECRET_PATH"
        echo "App: $APP_NAME"
      - |
        PROVIDER=$(jq -r '.secrets.provider' deploy/konfig.json)
        SECRET_PATH=$(jq -r '.secrets.path' deploy/konfig.json)

        case "$PROVIDER" in
          phase)
            echo "=== Fetching secrets from Phase ==="
            if [ -z "$${PHASE_SERVICE_TOKEN}" ]; then
              echo "FAIL: PHASE_SERVICE_TOKEN secret not set in Woodpecker"
              exit 1
            fi
            if [ -z "$${PHASE_HOST}" ]; then
              echo "WARN: PHASE_HOST not set, defaulting to https://phase.konoss.org"
              PHASE_HOST="https://phase.konoss.org"
            fi

            # Fetch secrets via Phase HTTP API
            APP_ID=$(curl -sf -H "Authorization: Bearer $${PHASE_SERVICE_TOKEN}" \
              "$${PHASE_HOST}/service/public/v1/apps/" | jq -r '.[0].id // empty')

            if [ -z "$APP_ID" ]; then
              echo "FAIL: Could not resolve Phase app ID"
              exit 1
            fi

            SECRETS_JSON=$(curl -sf -H "Authorization: Bearer $${PHASE_SERVICE_TOKEN}" \
              "$${PHASE_HOST}/service/public/v1/secrets/?app_id=${APP_ID}&env=Production&path=${SECRET_PATH}")

            if [ -z "$SECRETS_JSON" ] || [ "$SECRETS_JSON" = "[]" ]; then
              echo "FAIL: No secrets found at path $SECRET_PATH"
              exit 1
            fi

            # Write secrets to .env
            echo "# Generated by Woodpecker CI — do not edit" > .env
            echo "$SECRETS_JSON" | jq -r '.[] | "\(.key)=\(.value)"' >> .env
            echo "PASS: $(echo "$SECRETS_JSON" | jq length) secrets written to .env"
            ;;

          vaultwarden)
            echo "=== Fetching secrets from Vaultwarden ==="
            if [ -z "$${BW_HOST}" ]; then
              echo "FAIL: BW_HOST secret not set in Woodpecker"
              exit 1
            fi
            if [ -z "$${BW_EMAIL}" ] || [ -z "$${BW_PASSWORD}" ]; then
              echo "FAIL: BW_EMAIL / BW_PASSWORD secrets not set in Woodpecker"
              exit 1
            fi

            # Install Bitwarden CLI
            apk add --no-cache npm
            npm install -g @bitwarden/cli@2024.6.0

            # Configure server and login
            bw config server "$${BW_HOST}"
            export BW_SESSION=$(bw login "$${BW_EMAIL}" "$${BW_PASSWORD}" \
              --raw --nointeraction 2>/dev/null)

            if [ -z "$BW_SESSION" ]; then
              echo "FAIL: Could not authenticate to Vaultwarden"
              exit 1
            fi

            bw sync

            # Fetch collection items matching the secret path (app name)
            COLLECTION_NAME=$(echo "$SECRET_PATH" | tr -d '/')
            ITEMS=$(bw list items --search "$COLLECTION_NAME" --session "$BW_SESSION")

            if [ -z "$ITEMS" ] || [ "$ITEMS" = "[]" ]; then
              echo "FAIL: No items found for $COLLECTION_NAME"
              exit 1
            fi

            # Write secrets to .env — each item's custom fields become KEY=VALUE
            echo "# Generated by Woodpecker CI — do not edit" > .env
            echo "$ITEMS" | jq -r '.[].fields[]? | "\(.name)=\(.value)"' >> .env
            COUNT=$(echo "$ITEMS" | jq '[.[].fields[]?] | length')
            echo "PASS: $COUNT secrets written to .env"
            ;;

          *)
            echo "FAIL: Unknown secrets provider '$PROVIDER'"
            echo "Supported: phase, vaultwarden"
            exit 1
            ;;
        esac
      - |
        echo "=== .env summary ==="
        wc -l < .env
        echo "lines (including header)"
        # Show keys only, never values
        grep -v '^#' .env | cut -d= -f1 | grep -v '^$' | sed 's/^/  /'
    environment:
      PHASE_SERVICE_TOKEN:
        from_secret: phase_service_token
      PHASE_HOST:
        from_secret: phase_host
      BW_HOST:
        from_secret: bw_host
      BW_EMAIL:
        from_secret: bw_email
      BW_PASSWORD:
        from_secret: bw_password

  - name: check-standard-files
    image: alpine:3.20
    commands:
      - echo "=== Checking standard project files ==="
      - |
        FAIL=0
        WARN=0

        check_required() {
          if [ -f "$1" ]; then
            echo "PASS: $1"
          else
            echo "FAIL: $1 is missing (required)"
            FAIL=1
          fi
        }

        check_optional() {
          if [ -f "$1" ]; then
            echo "PASS: $1"
          else
            echo "WARN: $1 is missing (recommended)"
            WARN=1
          fi
        }

        echo "--- Required files ---"
        check_required "README.md"
        check_required ".gitignore"

        # editorconfig + env.example can be in root or config/
        if [ -f ".editorconfig" ] || [ -f "config/.editorconfig" ]; then
          echo "PASS: .editorconfig"
        else
          echo "FAIL: .editorconfig is missing (required)"
          FAIL=1
        fi

        if [ -f ".env.example" ] || [ -f "config/.env.example" ]; then
          echo "PASS: .env.example"
        else
          echo "FAIL: .env.example is missing (required)"
          FAIL=1
        fi

        # konfig.json can be in config/ or deploy/
        if [ -f "config/konfig.json" ] || [ -f "deploy/konfig.json" ] || [ -f "konfig.json" ]; then
          echo "PASS: konfig.json"
        else
          echo "FAIL: konfig.json is missing (required — config/ or deploy/)"
          FAIL=1
        fi

        echo ""
        echo "--- Recommended files ---"
        check_optional "QUICKSTART.md"
        check_optional "KONTANGO.md"
        check_optional "CLAUDE.md"

        echo ""
        if [ "$FAIL" = "1" ]; then
          echo "ERROR: Required files are missing"
          exit 1
        elif [ "$WARN" = "1" ]; then
          echo "WARNING: Some recommended files are missing"
        else
          echo "All standard files present."
        fi
