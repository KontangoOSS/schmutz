name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check standard files
        run: |
          echo "Checking required files..."
          FAIL=0
          for f in README.md .gitignore; do
            [ -f "$f" ] && echo "PASS: $f" || { echo "FAIL: $f"; FAIL=1; }
          done
          # konfig.json can be in config/ or deploy/
          if [ -f config/konfig.json ] || [ -f deploy/konfig.json ]; then
            echo "PASS: konfig.json"
          else
            echo "FAIL: konfig.json"; FAIL=1
          fi
          [ "$FAIL" = "1" ] && exit 1 || echo "All required files present"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Run lint
        run: make lint
