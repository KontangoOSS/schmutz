services:

  # ── Caddy: single public port, full ALPN mux ─────────────────────────────
  caddy:
    image: schmutz-caddy:dev
    ports:
      - "443:443"     # only public port — ALPN mux handles everything
    volumes:
      - ./deploy/caddy/Caddyfile.compose:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - ziti
      - enroll
      - controller
    networks:
      - schmutz

  # ── Ziti controller ──────────────────────────────────────────────────────
  ziti:
    image: openziti/ziti-controller:latest
    expose:
      - "6262"    # enrollment + management (TLS, ALPN ziti-*)
    volumes:
      - ziti-data:/var/lib/ziti
    environment:
      - ZITI_USER=${ZITI_ADMIN_USER:-admin}
      - ZITI_PWD=${ZITI_ADMIN_PASS:-Admin1234!}
      - ZITI_CTRL_ADVERTISED_ADDRESS=${ZITI_HOST:-localhost}
      - ZITI_CTRL_ADVERTISED_PORT=6262
      - ZITI_CTRL_BIND_ADDRESS=0.0.0.0
      - ZITI_CTRL_EDGE_BIND_PORT=6262
    networks:
      - schmutz

  # ── OpenBao ──────────────────────────────────────────────────────────────
  bao:
    image: openbao/openbao:latest
    expose:
      - "8200"
    cap_add:
      - IPC_LOCK
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=${BAO_ROOT_TOKEN:-dev-root-token}
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    command: server -dev
    networks:
      - schmutz

  # ── Forgejo (catalog + git) ───────────────────────────────────────────────
  forgejo:
    image: codeberg.org/forgejo/forgejo:10
    expose:
      - "3000"
    volumes:
      - forgejo-data:/data
    environment:
      - USER_UID=1000
      - USER_GID=1000
    networks:
      - schmutz

  # ── Enroll server (hub API) ──────────────────────────────────────────────
  enroll:
    image: schmutz-enroll:dev
    expose:
      - "8765"
    environment:
      - LISTEN_ADDR=0.0.0.0:8765
      - BAO_ADDR=http://bao:8200
      - BAO_TOKEN=${BAO_ROOT_TOKEN:-dev-root-token}
      - BAO_SKIP_VERIFY=1
      - ZITI_API=https://ziti:6262
      - ZITI_USERNAME=${ZITI_ADMIN_USER:-admin}
      - ZITI_PASSWORD=${ZITI_ADMIN_PASS:-Admin1234!}
      - FORGEJO_URL=http://forgejo:3000
      - FORGEJO_TOKEN=${FORGEJO_TOKEN:-}
      - FORGEJO_ORG=public
      - HUB_ADMIN_TOKEN=${HUB_ADMIN_TOKEN:-dev-admin-token}
      - AGENT_BAO_ADDR=http://bao:8200
    depends_on:
      - bao
      - ziti
      - forgejo
    networks:
      - schmutz
    restart: on-failure

  # ── Controller (management plane) ─────────────────────────────────────────
  controller:
    image: schmutz-controller:dev
    expose:
      - "3080"    # all-routes debug mux (container-internal only)
      - "3081"    # ziti-admin.tango
      - "3082"    # bao-admin.tango
      - "3083"    # identity-admin.tango
      - "3084"    # machine-api.tango
      - "3085"    # metrics.tango
      - "3086"    # catalog-api.tango
      - "3087"    # security-api.tango
    environment:
      - LISTEN_ADDR=0.0.0.0:3080
      - BAO_ADDR=http://bao:8200
      - BAO_TOKEN=${BAO_ROOT_TOKEN:-dev-root-token}
      - ZITI_CTRL_ADDR=ziti:6262
      - ZITI_ADMIN_USER=${ZITI_ADMIN_USER:-admin}
      - ZITI_ADMIN_PASS=${ZITI_ADMIN_PASS:-Admin1234!}
      - NODE_NAME=compose-ctrl-1
    depends_on:
      - bao
      - ziti
    networks:
      - schmutz
    restart: on-failure

volumes:
  caddy-data:
  caddy-config:
  ziti-data:
  forgejo-data:

networks:
  schmutz:
    driver: bridge
