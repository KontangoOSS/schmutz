steps:
  - name: test-shared
    image: golang:1.26-alpine
    environment:
      GONOSUMDB: git.konoss.org
      GOPROXY: direct,https://proxy.golang.org
    commands:
      - apk add --no-cache git ca-certificates -q
      - cd shared && go mod download && go test ./...

  - name: test-agent
    image: golang:1.26-alpine
    environment:
      GONOSUMDB: git.konoss.org
      GOPROXY: direct,https://proxy.golang.org
    commands:
      - apk add --no-cache git gcc musl-dev ca-certificates -q
      - cd agent && go mod download && go test ./...

  - name: test-enroll
    image: golang:1.26-alpine
    environment:
      GONOSUMDB: git.konoss.org
      GOPROXY: direct,https://proxy.golang.org
    commands:
      - apk add --no-cache git ca-certificates -q
      - cd enroll && go mod download && go test ./...

  - name: test-controller
    image: golang:1.26-alpine
    environment:
      GONOSUMDB: git.konoss.org
      GOPROXY: direct,https://proxy.golang.org
    commands:
      - apk add --no-cache git ca-certificates -q
      - cd controller && go mod download && go test ./...

  - name: build-agent
    image: golang:1.26-alpine
    environment:
      GONOSUMDB: git.konoss.org
      GOPROXY: direct,https://proxy.golang.org
    commands:
      - apk add --no-cache git gcc musl-dev ca-certificates -q
      - cd agent && go build ./cmd/schmutz/

  - name: build-enroll
    image: golang:1.26-alpine
    environment:
      GONOSUMDB: git.konoss.org
      GOPROXY: direct,https://proxy.golang.org
    commands:
      - apk add --no-cache git ca-certificates -q
      - cd enroll && go build ./cmd/enroll-server/

  - name: build-controller
    image: golang:1.26-alpine
    environment:
      GONOSUMDB: git.konoss.org
      GOPROXY: direct,https://proxy.golang.org
    commands:
      - apk add --no-cache git ca-certificates -q
      - cd controller && go build ./cmd/schmutz-controller/
