steps:
  - name: build
    image: golang:1.25
    commands:
      - cd src && go build ./...

  - name: test
    image: golang:1.25
    commands:
      - cd src && go test ./...

  - name: shared-sync-check
    image: alpine/git
    commands:
      - git clone http://10.11.30.30:3000/kore/ziti-base.git /tmp/ziti-base --depth=1 --quiet
      - |
        diff -rq --exclude="*_test.go" \
          src/internal/shared/ \
          /tmp/ziti-base/server/internal/shared/ \
        && echo "shared/ packages are in sync" \
        || (echo "ERROR: shared/ packages have drifted between schmutz and ziti-base — update both repos together"; exit 1)
