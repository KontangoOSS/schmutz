# deploy/caddy/enroll-vhost.conf
# Add to /etc/caddy/Caddyfile on each controller, alongside the layer4 block.

enroll.kontango.net {
  encode gzip
  log {
    output file /var/log/caddy/enroll-access.log
  }

  # Static agent script — operators curl this
  handle /agent.sh {
    root * /var/www/enroll
    file_server
    header Content-Type "application/x-sh"
  }

  # API endpoints proxied to the local Go service on loopback
  handle /api/* {
    reverse_proxy 127.0.0.1:8765
  }

  # Health endpoint
  handle /healthz {
    reverse_proxy 127.0.0.1:8765
  }

  # Default response — short message
  respond "kontango enroll endpoint" 200
}
