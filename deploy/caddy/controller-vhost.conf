# deploy/caddy/controller-vhost.conf
#
# Caddy config for schmutz-controller (management plane).
#
# CURRENT STATE: Controller is overlay-only. Operators reach it via the Ziti
# overlay at schmutz.tango. No public SNI vhost is configured yet.
#
# The controller binary binds to 127.0.0.1:3080 by default (LISTEN_ADDR env).
# The Ziti edge listener routes schmutz.tango:443 → 127.0.0.1:3080 inside
# the controller's Ziti SDK (ZITI_IDENTITY + ZITI_SERVICE_NAME env vars).
#
# FUTURE: Once the controller is proven stable on the overlay, add a public
# SNI vhost below (ctrl.kontango.net:9446) and add the SNI route to the
# layer4 block in the main Caddyfile:
#
#   @ctrl tls sni ctrl.kontango.net
#   route @ctrl {
#     proxy 127.0.0.1:9446
#   }
#
# Then uncomment and configure the vhost below:
#
# ctrl.kontango.net:9446 {
#   tls {
#     issuer acme {
#       dns cloudflare <CLOUDFLARE_TOKEN>
#     }
#   }
#   encode gzip
#   log {
#     output file /var/log/caddy/ctrl-access.log
#   }
#
#   # All management plane APIs
#   handle /api/* {
#     reverse_proxy 127.0.0.1:3080
#   }
#
#   # Health check
#   handle /api/health {
#     reverse_proxy 127.0.0.1:3080
#   }
# }

# ── Overlay access (current) ─────────────────────────────────────────────────
# The controller's Ziti edge listener handles schmutz.tango internally.
# Configure via environment variables in the systemd unit:
#
#   ZITI_IDENTITY=/etc/ziti/machine-<ctrl-id>.json
#   ZITI_SERVICE_NAME=schmutz.tango
#
# With these set, the controller SDK dials the overlay and accepts connections
# from any identity with dial permission on schmutz.tango.
# No Caddyfile changes needed for overlay-only access.
